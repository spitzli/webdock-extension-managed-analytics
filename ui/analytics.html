<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Managed Analytics</title><link rel="stylesheet" href="/ui/analytics.css"><script defer src="/ui/analytics.js"></script></head><body><main><header><div><h1>Know your audience.</h1><p>Website analytics, managed with your project.</p></div><span class="badge">Powered by Umami</span></header><p id="status" role="status">Connecting to your project…</p><section id="setup" hidden><h2>Enable analytics</h2><form id="enable"><label>Website name<input name="name" required maxlength="100" placeholder="My website"></label><label>Website domain<input name="domain" required maxlength="253" placeholder="example.com" autocapitalize="none"></label><button>Enable analytics</button></form></section><section id="overview" hidden><div class="section-title"><div><h2 id="site-name"></h2><p id="site-domain"></p></div><button id="refresh" class="secondary">Refresh</button></div><p class="period">Last 7 days</p><dl id="metrics"><div><dt>Visitors</dt><dd id="visitors">—</dd></div><div><dt>Page views</dt><dd id="pageviews">—</dd></div><div><dt>Visits</dt><dd id="visits">—</dd></div></dl><h2>Add tracking to your website</h2><p>Place this script in your website layout. Your project uses its own website ID.</p><pre id="snippet"></pre><button id="copy" class="secondary">Select tracking code</button><p id="tracking-domain"></p></section></main></body></html>
